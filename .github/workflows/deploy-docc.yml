name: Deploy DocC

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build DocC
        run: |
          xcrun docc convert \
            console-log-experiment/Sources/console-log-experiment/ConsoleLogExperiment.docc \
            --fallback-display-name "console-log-experiment" \
            --fallback-bundle-identifier "com.example.console-log-experiment" \
            --fallback-default-module-kind "Command-line Tool" \
            --hosting-base-path "2026-concurrency-lab/console-log-experiment" \
            --output-dir ".build/docc"

      - name: Prepare Pages
        run: |
          mkdir -p .build/pages/console-log-experiment
          cp -R .build/docc/. .build/pages/console-log-experiment/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ".build/pages"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
